<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Onboarding prototype</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --ink:#13233A;
    --ink-2:#3D5066;
    --ink-muted:#7A8AA0;
    --paper:#F4F5F2;
    --card:#FFFFFF;
    --line:#E2E5DE;
    --brand:#13233A;
    --amber:#E8A13C;
    --amber-ink:#5C3B0A;
    --green:#2F7D5A;
    --green-bg:#E7F3EC;
    --danger:#C4432E;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:transparent;
    display:flex;
    justify-content:center;
    padding:24px 0;
  }
  .frame{
    width:360px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:36px;
    padding:14px 14px 20px;
    box-shadow:0 1px 0 var(--line);
  }
  .notch{
    width:100px;height:22px;background:var(--ink);
    border-radius:0 0 14px 14px;margin:0 auto 6px;
  }
  .status{
    display:flex;justify-content:space-between;align-items:center;
    font-size:13px;font-weight:500;color:var(--ink);
    padding:2px 8px 10px;
  }
  .screen{
    background:var(--paper);
    border-radius:20px;
    min-height:560px;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 4px 14px;
  }
  .back-btn{
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--card);border:0.5px solid var(--line);
    cursor:pointer;color:var(--ink-2);font-size:16px;
  }
  .back-btn.hidden{visibility:hidden;}
  .dots{display:flex;gap:6px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s,width .2s;}
  .dot.active{background:var(--brand);width:16px;border-radius:3px;}
  .dot.done{background:var(--green);}
  .step-count{font-size:12px;color:var(--ink-muted);}

  .body{flex:1;padding:4px 6px 0;overflow-y:auto;}
  .eyebrow{font-size:12px;font-weight:500;color:var(--amber-ink);background:#FBEDD6;display:inline-block;padding:3px 10px;border-radius:20px;margin-bottom:14px;}
  h1{font-size:21px;font-weight:600;margin:0 0 6px;line-height:1.3;}
  .sub{font-size:14px;color:var(--ink-2);margin:0 0 22px;line-height:1.5;}

  label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin:14px 0 6px;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=tel],input[type=email],select{
    width:100%;height:42px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);padding:0 12px;font-size:14.5px;color:var(--ink);
    outline:none;
  }
  input:focus,select:focus{border-color:var(--brand);}
  .hint{font-size:12px;color:var(--ink-muted);margin-top:4px;}
  .error{font-size:12px;color:var(--danger);margin-top:5px;display:none;}
  .field.err input{border-color:var(--danger);}
  .field.err .error{display:block;}

  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
  .role-card{
    border:1px solid var(--line);border-radius:12px;padding:14px 10px;
    background:var(--card);cursor:pointer;text-align:center;
  }
  .role-card i{font-size:22px;color:var(--ink-2);margin-bottom:8px;display:block;}
  .role-card span{font-size:13px;font-weight:500;}
  .role-card.selected{border:2px solid var(--brand);background:#EEF1F5;}
  .role-card.selected i{color:var(--brand);}

  .channel-row{
    display:flex;align-items:center;gap:12px;
    border:1px solid var(--line);border-radius:12px;background:var(--card);
    padding:12px 12px;margin-bottom:10px;
  }
  .channel-icon{
    width:36px;height:36px;border-radius:10px;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:17px;
    background:#EEF1F5;color:var(--ink-2);
  }
  .channel-icon.on{background:var(--green-bg);color:var(--green);}
  .channel-text{flex:1;}
  .channel-text p{margin:0;font-size:14px;font-weight:500;}
  .channel-text span{font-size:12px;color:var(--ink-muted);}
  .switch{
    width:38px;height:22px;border-radius:20px;background:var(--line);
    position:relative;flex:none;cursor:pointer;transition:background .15s;
  }
  .switch.on{background:var(--green);}
  .switch .knob{
    position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:#fff;transition:transform .15s;
  }
  .switch.on .knob{transform:translateX(16px);}

  .summary-card{
    border:1px solid var(--line);border-radius:12px;background:var(--card);
    padding:14px;margin-top:6px;
  }
  .summary-row{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line);}
  .summary-row:last-child{border-bottom:none;}
  .summary-row span:first-child{color:var(--ink-muted);}
  .summary-row span:last-child{font-weight:500;text-align:right;}

  .success-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:36px;}
  .success-icon{
    width:64px;height:64px;border-radius:50%;background:var(--green-bg);
    display:flex;align-items:center;justify-content:center;color:var(--green);
    font-size:30px;margin-bottom:18px;
  }

  .footer{padding:14px 6px 2px;}
  button.primary{
    width:100%;height:46px;border-radius:12px;border:none;
    background:var(--brand);color:#fff;font-size:14.5px;font-weight:500;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  button.primary:active{transform:scale(0.98);}
  .skip{
    text-align:center;font-size:12.5px;color:var(--ink-muted);margin-top:10px;cursor:pointer;
  }

  .tabbar{
    display:flex;justify-content:space-around;padding-top:14px;margin-top:10px;
    border-top:1px solid var(--line);
  }
  .tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-muted);font-size:10.5px;}
  .tabbar div.active{color:var(--brand);}
  .tabbar i{font-size:19px;}

  .job-preview{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .job-preview .l p{margin:0;font-size:13.5px;font-weight:500;}
  .job-preview .l span{font-size:12px;color:var(--ink-muted);}
  .badge{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;background:var(--green-bg);color:var(--green);}

  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
</style>
</head>
<body>
<h2 class="sr-only">A six step mobile onboarding flow for a mechanic invoicing app: welcome, business setup, trade type, notification channel setup, first customer, and a completion screen leading to the dashboard.</h2>

<div class="frame">
  <div class="notch"></div>
  <div class="status">
    <span id="clock">09:41</span>
    <span><i class="ti ti-antenna-bars-5" aria-hidden="true"></i> <i class="ti ti-wifi" aria-hidden="true"></i> <i class="ti ti-battery-3" aria-hidden="true"></i></span>
  </div>

  <div class="screen">
    <div class="topbar">
      <div class="back-btn hidden" id="backBtn" onclick="prevStep()" aria-label="Back"><i class="ti ti-chevron-left" aria-hidden="true"></i></div>
      <div class="dots" id="dots"></div>
      <span class="step-count" id="stepCount"></span>
    </div>

    <div class="body" id="body"></div>

    <div class="footer">
      <button class="primary" id="nextBtn" onclick="nextStep()">Continue <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
      <div class="skip" id="skipLink" style="display:none" onclick="nextStep()">Skip for now</div>
    </div>
  </div>
</div>

<script>
const state = { role:null, channels:{email:true,sms:false,whatsapp:false}, business:{}, customer:{} };
let step = 0;
const totalSteps = 6;

function setError(fieldId, show){
  const f = document.getElementById(fieldId);
  if(f) f.classList.toggle('err', show);
}

function renderDots(){
  const dots = document.getElementById('dots');
  dots.innerHTML='';
  for(let i=0;i<totalSteps;i++){
    const d=document.createElement('div');
    d.className='dot'+(i===step?' active':i<step?' done':'');
    dots.appendChild(d);
  }
  document.getElementById('stepCount').textContent = (step+1)+' / '+totalSteps;
  document.getElementById('backBtn').classList.toggle('hidden', step===0 || step===totalSteps-1);
}

function screens(){
  return [
  // 0 Welcome
  `<div style="text-align:center;padding-top:30px;">
    <div style="width:64px;height:64px;border-radius:16px;background:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
      <i class="ti ti-tools" style="color:#fff;font-size:28px;" aria-hidden="true"></i>
    </div>
    <span class="eyebrow">For independent mechanics</span>
    <h1>Set up your workshop</h1>
    <p class="sub">Track customers and vehicles, and send digital invoices by email, SMS or WhatsApp — no paper, no chasing payments.</p>
    <div style="display:flex;flex-direction:column;gap:10px;text-align:left;margin-top:24px;">
      <div style="display:flex;gap:10px;align-items:flex-start;"><i class="ti ti-clipboard-list" style="color:var(--green);font-size:18px;margin-top:2px;" aria-hidden="true"></i><span style="font-size:13.5px;color:var(--ink-2);">Log every job against a customer and vehicle</span></div>
      <div style="display:flex;gap:10px;align-items:flex-start;"><i class="ti ti-file-invoice" style="color:var(--green);font-size:18px;margin-top:2px;" aria-hidden="true"></i><span style="font-size:13.5px;color:var(--ink-2);">Turn a job into an invoice in one tap</span></div>
      <div style="display:flex;gap:10px;align-items:flex-start;"><i class="ti ti-brand-whatsapp" style="color:var(--green);font-size:18px;margin-top:2px;" aria-hidden="true"></i><span style="font-size:13.5px;color:var(--ink-2);">Send it by email, SMS or WhatsApp</span></div>
    </div>
  </div>`,

  // 1 Business setup
  `<h1>Your workshop details</h1>
  <p class="sub">This appears on every quote and invoice you send.</p>
  <div class="field" id="f-bizname">
    <label for="bizname">Workshop name</label>
    <input type="text" id="bizname" placeholder="Chikwanha Auto Repairs">
    <div class="error">Enter your workshop name</div>
  </div>
  <div class="field" id="f-owner">
    <label for="owner">Your name</label>
    <input type="text" id="owner" placeholder="Elihu Munyaradzi">
    <div class="error">Enter your name</div>
  </div>
  <div class="field" id="f-phone">
    <label for="phone">Phone number</label>
    <input type="tel" id="phone" placeholder="+263 77 123 4567">
    <div class="error">Enter a phone number</div>
  </div>`,

  // 2 Trade type
  `<h1>What's your specialty?</h1>
  <p class="sub">We'll tailor job cards and inventory templates to it.</p>
  <div class="role-grid" id="roleGrid">
    <div class="role-card" data-role="general" onclick="pickRole('general')"><i class="ti ti-engine" aria-hidden="true"></i><span>General mechanic</span></div>
    <div class="role-card" data-role="body" onclick="pickRole('body')"><i class="ti ti-car-crash" aria-hidden="true"></i><span>Body &amp; panel</span></div>
    <div class="role-card" data-role="electrical" onclick="pickRole('electrical')"><i class="ti ti-bolt" aria-hidden="true"></i><span>Auto electrical</span></div>
    <div class="role-card" data-role="tyres" onclick="pickRole('tyres')"><i class="ti ti-circle-dashed" aria-hidden="true"></i><span>Tyres &amp; alignment</span></div>
  </div>
  <div class="error" id="roleError" style="display:none;margin-top:10px;">Pick a specialty to continue</div>`,

  // 3 Notification channels
  `<h1>How should invoices reach customers?</h1>
  <p class="sub">Turn on the channels you want to use. You can change this later.</p>
  <div class="channel-row">
    <div class="channel-icon on" id="icon-email"><i class="ti ti-mail" aria-hidden="true"></i></div>
    <div class="channel-text"><p>Email</p><span>Sends a link to view or download the PDF</span></div>
    <div class="switch on" id="sw-email" onclick="toggleChannel('email')"><div class="knob"></div></div>
  </div>
  <div class="channel-row">
    <div class="channel-icon" id="icon-sms"><i class="ti ti-message" aria-hidden="true"></i></div>
    <div class="channel-text"><p>SMS</p><span>Text message with a secure invoice link</span></div>
    <div class="switch" id="sw-sms" onclick="toggleChannel('sms')"><div class="knob"></div></div>
  </div>
  <div class="channel-row">
    <div class="channel-icon" id="icon-whatsapp"><i class="ti ti-brand-whatsapp" aria-hidden="true"></i></div>
    <div class="channel-text"><p>WhatsApp</p><span>Sent from your workshop's WhatsApp number</span></div>
    <div class="switch" id="sw-whatsapp" onclick="toggleChannel('whatsapp')"><div class="knob"></div></div>
  </div>
  <div class="error" id="channelError" style="display:none;">Turn on at least one channel</div>`,

  // 4 First customer
  `<h1>Add your first customer</h1>
  <p class="sub">You can bulk-import a customer list later from Settings.</p>
  <div class="field" id="f-custname">
    <label for="custname">Customer name</label>
    <input type="text" id="custname" placeholder="Tariro Moyo">
    <div class="error">Enter a customer name</div>
  </div>
  <div class="field" id="f-custphone">
    <label for="custphone">Phone number</label>
    <input type="tel" id="custphone" placeholder="+263 71 234 5678">
    <div class="error">Enter a phone number</div>
  </div>
  <label for="vehicle">Vehicle</label>
  <input type="text" id="vehicle" placeholder="Toyota Hilux · AEG 4521">`,

  // 5 Success
  `<div class="success-wrap">
    <div class="success-icon"><i class="ti ti-check" aria-hidden="true"></i></div>
    <h1>Workshop ready</h1>
    <p class="sub">Your first customer is saved. Create a job card whenever they bring the vehicle in.</p>
  </div>
  <div class="summary-card" id="summaryCard"></div>`
  ];
}

function pickRole(role){
  state.role = role;
  document.querySelectorAll('.role-card').forEach(c=>c.classList.toggle('selected', c.dataset.role===role));
  document.getElementById('roleError').style.display='none';
}

function toggleChannel(ch){
  state.channels[ch] = !state.channels[ch];
  document.getElementById('sw-'+ch).classList.toggle('on', state.channels[ch]);
  document.getElementById('icon-'+ch).classList.toggle('on', state.channels[ch]);
  document.getElementById('channelError').style.display='none';
}

function render(){
  document.getElementById('body').innerHTML = screens()[step];
  renderDots();
  const nextBtn = document.getElementById('nextBtn');
  const skip = document.getElementById('skipLink');
  skip.style.display = (step===3) ? 'block' : 'none';

  if(step===0){ nextBtn.innerHTML = 'Get started <i class="ti ti-arrow-right" aria-hidden="true"></i>'; }
  else if(step===totalSteps-1){ nextBtn.innerHTML = 'Go to dashboard <i class="ti ti-layout-dashboard" aria-hidden="true"></i>'; }
  else { nextBtn.innerHTML = 'Continue <i class="ti ti-arrow-right" aria-hidden="true"></i>'; }

  if(step===2){
    document.querySelectorAll('.role-card').forEach(c=>c.classList.toggle('selected', c.dataset.role===state.role));
  }
  if(step===3){
    ['email','sms','whatsapp'].forEach(ch=>{
      document.getElementById('sw-'+ch).classList.toggle('on', state.channels[ch]);
      document.getElementById('icon-'+ch).classList.toggle('on', state.channels[ch]);
    });
  }
  if(step===5){
    const chList = Object.keys(state.channels).filter(c=>state.channels[c]).map(c=>c[0].toUpperCase()+c.slice(1)).join(', ') || 'None';
    document.getElementById('summaryCard').innerHTML = `
      <div class="summary-row"><span>Workshop</span><span>${state.business.bizname || '—'}</span></div>
      <div class="summary-row"><span>Specialty</span><span>${state.role || '—'}</span></div>
      <div class="summary-row"><span>Notify via</span><span>${chList}</span></div>
      <div class="summary-row"><span>First customer</span><span>${state.customer.custname || '—'}</span></div>
    `;
  }
}

function validateStep(){
  if(step===1){
    let ok=true;
    const bizname=document.getElementById('bizname').value.trim();
    const owner=document.getElementById('owner').value.trim();
    const phone=document.getElementById('phone').value.trim();
    setError('f-bizname', !bizname); if(!bizname) ok=false;
    setError('f-owner', !owner); if(!owner) ok=false;
    setError('f-phone', !phone); if(!phone) ok=false;
    if(ok){ state.business = {bizname, owner, phone}; }
    return ok;
  }
  if(step===2){
    if(!state.role){ document.getElementById('roleError').style.display='block'; return false; }
    return true;
  }
  if(step===3){
    const any = Object.values(state.channels).some(v=>v);
    if(!any){ document.getElementById('channelError').style.display='block'; return false; }
    return true;
  }
  if(step===4){
    let ok=true;
    const custname=document.getElementById('custname').value.trim();
    const custphone=document.getElementById('custphone').value.trim();
    setError('f-custname', !custname); if(!custname) ok=false;
    setError('f-custphone', !custphone); if(!custphone) ok=false;
    if(ok){ state.customer = {custname, custphone, vehicle: document.getElementById('vehicle').value.trim()}; }
    return ok;
  }
  return true;
}

function nextStep(){
  if(step===totalSteps-1){
    step=0; render(); return;
  }
  if(!validateStep()) return;
  step = Math.min(step+1, totalSteps-1);
  render();
}
function prevStep(){
  step = Math.max(step-1, 0);
  render();
}

render();

function tick(){
  const d=new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false});
}
tick(); setInterval(tick, 30000);
</script>
</body>
</html>
