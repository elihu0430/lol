<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nebula Gaming Hub – Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <span class="logo-icon">🎮</span>
      <span class="logo-text">Nebula<span>Zone</span></span>
    </div>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="games.html">Games</a></li>
        <li><a href="gallery.html" class="active">Gallery</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-main">
    <header class="page-header-block">
      <h1>Screenshot gallery</h1>
      <p>Simple gallery layout using <code>&lt;figure&gt;</code> and <code>&lt;img&gt;</code> tags.</p>
    </header>

    <section class="section">
      <div class="gallery-grid">
        <figure class="gallery-card">
          <img src="images/game1.svg" alt="Galaxy Raiders screenshot" />
          <figcaption class="gallery-body">
            <h3>Galaxy Raiders</h3>
            <p>Neon space station map with glowing planets in the background.</p>
          </figcaption>
        </figure>

        <figure class="gallery-card">
          <img src="images/game2.svg" alt="Cyber Drift screenshot" />
          <figcaption class="gallery-body">
            <h3>Cyber Drift</h3>
            <p>Rainy cyber-highway with holographic billboards and drifting cars.</p>
          </figcaption>
        </figure>

        <figure class="gallery-card">
          <img src="images/game3.svg" alt="Void Tactics screenshot" />
          <figcaption class="gallery-body">
            <h3>Void Tactics</h3>
            <p>Isometric tactical arena with grid-based movement and cover.</p>
          </figcaption>
        </figure>

        <figure class="gallery-card">
          <img src="images/game4.svg" alt="Neon District map concept" />
          <figcaption class="gallery-body">
            <h3>Neon District</h3>
            <p>City skyline with bright neon lights and a dark night sky.</p>
          </figcaption>
        </figure>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <small>&copy; 2025 NebulaZone – CSS Gaming Template for classroom use.</small>
  </footer>

</body>
</html>
